<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>UNiBOX</title>
  <style>
    :root {
      --hackathon: #8e24aa;
      --academic: #1a73e8;
      --announcement: #f9ab00;
      --placement: #188038;
      --unsure: #d93025;
      --all: #5f6368;
    }
    body {
      width: 260px;
      margin: 0;
      font-family: "Google Sans", Roboto, Arial, sans-serif;
      color: #202124;
      background: #fff;
    }
    header {
      display: flex;
      align-items: baseline;
      gap: 8px;
      padding: 12px 14px;
      background: linear-gradient(#ffffff, #f6f8fc);
      border-bottom: 1px solid #e6e9ee;
    }
    header .name { font-size: 15px; font-weight: 700; color: #1a73e8; letter-spacing: .3px; }
    header .tag { font-size: 11px; color: #5f6368; }

    .cats { padding: 6px 8px; }
    .cat {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: none;
      font-size: 13px;
      color: #3c4043;
      cursor: pointer;
      text-align: left;
    }
    .cat:hover { background: #f1f3f4; }
    .cat[aria-pressed="true"] {
      border-color: var(--c, #9aa0a6);
      background: color-mix(in srgb, var(--c, #9aa0a6) 12%, #fff);
      font-weight: 600;
      color: #202124;
    }
    .cat .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c, #9aa0a6); flex: none; }
    .cat .label { flex: 1; }
    .cat .count {
      min-width: 18px;
      padding: 1px 7px;
      border-radius: 999px;
      background: #eceff1;
      color: #5f6368;
      font-size: 11px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .note { padding: 8px 14px; font-size: 12px; color: #5f6368; }

    footer { border-top: 1px solid #e6e9ee; padding: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
    footer button {
      flex: 1 1 auto;
      padding: 7px 8px;
      font-size: 12px;
      border: 1px solid #dadce0;
      border-radius: 7px;
      background: #fff;
      color: #3c4043;
      cursor: pointer;
    }
    footer button:hover { background: #f1f3f4; }
    footer button.primary { background: #1a73e8; border-color: #1a73e8; color: #fff; }
    footer button.primary:hover { background: #1765cc; }

    #status { padding: 0 14px 10px; font-size: 12px; color: #188038; min-height: 14px; }
    .llm { padding: 4px 14px 10px; font-size: 12px; color: #5f6368; }
    .llm b { color: #202124; font-weight: 600; }
  </style>
</head>
<body>
  <header>
    <span class="name">UNiBOX</span>
    <span class="tag">Gmail inbox filter</span>
  </header>

  <div id="cats" class="cats"></div>
  <div id="note" class="note" hidden>Open a Gmail tab to see live counts.</div>
  <div class="llm" id="llm">LLM fallback: <b id="llm-state">checking…</b></div>

  <footer>
    <button id="settings" class="primary">Settings</button>
    <button id="clear-log">Clear Unsure log</button>
    <button id="reset-cache">Reset LLM cache</button>
  </footer>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
